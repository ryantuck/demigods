<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundamental Theorem of Calculus</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        body {
            background-color: #0d0d0d;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.6;
            margin: 0;
        }

        main {
            max-width: 1440px;
            margin: 0 auto;
            padding: 24px 16px 64px;
        }

        .sig {
            color: #666;
            font-size: 0.8em;
            margin: 0 0 24px;
        }

        a {
            color: #00ffff;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: color 0.3s ease, border-color 0.3s ease;
        }

        a:hover,
        a:focus-visible {
            color: #ff00ff;
            border-bottom-color: #ff00ff;
        }

        h1, h2 {
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            text-wrap: balance;
        }

        h1 {
            font-size: clamp(1.6em, 6vw, 3em);
            color: #00ff00;
            text-shadow: 0 0 5px #00ff00, 0 0 10px #00ff00;
            margin: 24px 0 8px;
        }

        h2 {
            font-size: 1.1em;
            color: #ff00ff;
            text-shadow: 0 0 5px #ff00ff;
            margin: 0 0 12px;
        }

        .dek {
            color: #888;
            margin: 0 0 32px;
            max-width: 68ch;
        }

        /* Stacked by default; side by side once both fit, since the D3 page needs about 680px. */
        .compare {
            display: grid;
            gap: 48px;
            align-items: start;
        }

        @media (min-width: 1480px) {
            .compare {
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
                gap: 32px;
            }
        }

        figure {
            margin: 0;
            min-width: 0;
        }

        figure img {
            display: block;
            width: 100%;
            height: auto;
            border: 1px solid #333;
        }

        figure iframe {
            display: block;
            width: 100%;
            height: 950px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #000;
        }

        figcaption {
            margin-top: 10px;
            color: #888;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <main>
        <p class="sig">[AI - Claude]: Fundamental Theorem of Calculus</p>
        <a href="index.html">&larr; demigods</a>

        <h1>Fundamental Theorem of Calculus</h1>
        <p class="dek">The same visualization from two prompts: one asked for an SVG, the other asked for D3 explicitly.</p>

        <div class="compare">
            <figure>
                <h2>Prompted to create an SVG</h2>
                <img src="calculus.svg" alt="Fundamental Theorem of Calculus visualization drawn as a static SVG" width="800" height="500">
                <figcaption><a href="calculus.svg">open the svg on its own</a></figcaption>
            </figure>

            <figure>
                <h2>Prompted to create using D3 explicitly</h2>
                <iframe src="calculus_d3.html" title="D3 Calculus Visualization" loading="lazy"></iframe>
                <figcaption><a href="calculus_d3.html">open the d3 page on its own</a></figcaption>
            </figure>
        </div>
    </main>
</body>
</html>
